name: Validate skills
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate catalog, documents and source
        run: python scripts/manage_skills.py check
      - name: Test repository management
        run: python -m unittest discover -s tests -v
      - name: Test voice audio processing and input contracts
        run: python skills/expressive-voice/scripts/test_audio.py
      - name: Test 3D skill input contracts
        run: python skills/photo-to-3d-diorama/scripts/test_contracts.py
      - name: Test delivery review and batch record isolation
        run: python skills/photo-to-3d-diorama/scripts/test_delivery_review.py

